name: Chinese Lab content checks

on:
  push:
    branches:
      - main
      - 'chinese-lab/**'
    paths:
      - 'chinese/index.html'
      - 'chinese/sw.js'
      - 'chinese/data/**'
      - 'chinese/js/**'
      - 'chinese/css/**'
      - 'chinese/assets/**'
      - 'chinese/scripts/**'
      - 'tests/chinese/**'
      - '.github/workflows/chinese-content-checks.yml'
  pull_request:
    paths:
      - 'chinese/index.html'
      - 'chinese/sw.js'
      - 'chinese/data/**'
      - 'chinese/js/**'
      - 'chinese/css/**'
      - 'chinese/assets/**'
      - 'chinese/scripts/**'
      - 'tests/chinese/**'
      - '.github/workflows/chinese-content-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chinese-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Chinese Lab Node tests
        run: node --test tests/chinese/*.test.mjs
      - name: Install Chromium browser test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
      - name: Test first quest on mobile Chromium
        run: node tests/chinese/quest-browser.mjs
