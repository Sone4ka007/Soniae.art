name: Events pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'events/sources.json'
      - 'events/discovery_sources.json'
      - 'content/events_curated.json'
      - 'scripts/events/**'
      - '.github/workflows/events-pipeline.yml'
  workflow_dispatch:
    inputs:
      week_start:
        description: "Monday YYYY-MM-DD (optional)"
        required: false
        type: string
      city:
        description: "moscow or spb"
        required: false
        default: "moscow"
        type: string
  schedule:
    # Moscow time: 06:30, 12:30 and 18:30. Multiple daily passes make
    # source updates visible sooner and reduce reliance on one delayed cron.
    - cron: "30 3,9,15 * * *"

concurrency:
  group: events-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector and Google dependencies
        run: pip install beautifulsoup4 requests certifi google-api-python-client google-auth
      - name: Pull editor decisions before collection
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/events/pull_sheet.py
      - name: Collect structured events from official sources
        run: python scripts/events/collect_jsonld.py
      - name: Discover recurring festivals and design events
        run: python scripts/events/discover_special_events.py
      - name: Collect open calls from Sonya Telegram chat
        env:
          TELEGRAM_OPEN_CALLS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPEN_CALLS_BOT_TOKEN }}
          TELEGRAM_OPEN_CALLS_CHAT_ID: ${{ vars.TELEGRAM_OPEN_CALLS_CHAT_ID }}
        run: python scripts/events/collect_telegram_open_calls.py
      - name: Check ticket and registration availability
        run: python scripts/events/check_availability.py
      - name: Apply validation and editorial rules
        run: python scripts/events/validate_events.py
      - name: Normalize collected event data
        run: python scripts/events/quality_gate.py content/events.json --fix
      - name: Commit database changes
        run: |
          cp content/events.json /tmp/events-generated.json
          git fetch origin main
          git show origin/main:content/events.json > /tmp/events-remote.json
          git reset --hard origin/main
          python scripts/events/merge_remote_db.py /tmp/events-generated.json /tmp/events-remote.json content/events.json
          python scripts/events/quality_gate.py content/events.json --fix --strict
          if ! git diff --quiet -- content/events.json; then
            git config user.name "sonyae-events-bot"
            git config user.email "actions@users.noreply.github.com"
            git add content/events.json
            git commit -m "Update events database"
            git push
          fi
      - name: Push database to moderation Sheet
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/events/push_sheet.py

  weekly:
    if: github.event_name == 'workflow_dispatch'
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build source layouts
        run: |
          git pull --ff-only
          python scripts/events/build_weekly.py ${{ inputs.week_start && format('--week-start {0}', inputs.week_start) || '' }} --city "${{ inputs.city }}"
          python scripts/events/build_social.py ${{ inputs.week_start && format('--week-start {0}', inputs.week_start) || '' }} --city "${{ inputs.city }}"
      - name: Install renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render PDF and carousel
        run: node scripts/events/render_weekly.js
      - uses: actions/upload-artifact@v4
        with:
          name: events-${{ inputs.city }}-${{ inputs.week_start || 'next-week' }}
          path: dist/events-weekly/
          retention-days: 30
