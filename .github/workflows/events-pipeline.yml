name: Events pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'events/sources.json'
      - 'events/discovery_sources.json'
      - 'content/events_curated.json'
      - 'scripts/events/**'
      - '.github/workflows/events-pipeline.yml'
  workflow_dispatch:
    inputs:
      week_start:
        description: "Monday YYYY-MM-DD (optional)"
        required: false
        type: string
      city:
        description: "moscow or spb"
        required: false
        default: "moscow"
        type: string
  schedule:
    # Manual retrigger marker: 2026-09-26T10:37+03:00
    # Moscow time: 06:30, 12:30 and 18:30. Multiple daily passes make
    # source updates visible sooner and reduce reliance on one delayed cron.
    - cron: "30 3,9,15 * * *"
    # Sunday 19:00 Moscow: build next week's social packages.
    - cron: "0 16 * * 0"

concurrency:
  group: events-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast-forward to current main
        run: bash scripts/events/git_sync_main.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector and Google dependencies
        run: pip install beautifulsoup4 requests certifi google-api-python-client google-auth
      - name: Pull editor decisions before collection
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/events/pull_sheet.py
      - name: Collect structured events from official sources
        run: python scripts/events/collect_jsonld.py
      - name: Discover recurring festivals and design events
        run: python scripts/events/discover_special_events.py
      - name: Collect open calls from Sonya Telegram chat
        env:
          TELEGRAM_OPEN_CALLS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPEN_CALLS_BOT_TOKEN }}
          TELEGRAM_OPEN_CALLS_CHAT_ID: ${{ vars.TELEGRAM_OPEN_CALLS_CHAT_ID }}
        run: python scripts/events/collect_telegram_open_calls.py
      - name: Check ticket and registration availability
        run: python scripts/events/check_availability.py
      - name: Apply validation and editorial rules
        run: python scripts/events/validate_events.py
      - name: Normalize collected event data
        run: python scripts/events/quality_gate.py content/events.json --fix
      - name: Commit database changes
        run: |
          cp content/events.json /tmp/events-generated.json
          bash scripts/events/commit_merged_events.sh /tmp/events-generated.json "Update events database"
      - name: Push database to moderation Sheet
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          bash scripts/events/git_sync_main.sh
          python scripts/events/push_sheet.py
      - name: Persist editor changes captured during final Sheet push
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/events/persist_events_json.sh "Preserve late event moderation edits"

  weekly:
    if: github.event_name == 'workflow_dispatch'
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # collect may push a fresher events database during this same run.
          # The weekly job is read-only, so always render from the latest main.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build source layouts
        env:
          WEEK_START: ${{ inputs.week_start }}
          CITY: ${{ inputs.city }}
        run: |
          set -euo pipefail
          city="${CITY:-moscow}"
          if [ -n "${WEEK_START:-}" ]; then
            args=(--week-start "$WEEK_START" --city "$city")
          else
            args=(--city "$city")
          fi
          python scripts/events/build_weekly.py "${args[@]}"
          python scripts/events/build_social.py "${args[@]}"
      - name: Install renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render PDF and carousel
        run: node scripts/events/render_weekly.js
      - uses: actions/upload-artifact@v4
        with:
          name: events-${{ inputs.city }}-${{ inputs.week_start || 'next-week' }}
          path: dist/events-weekly/
          retention-days: 30


  social-weekly:
    if: github.event_name == 'schedule' && github.event.schedule == '0 16 * * 0'
    needs: collect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        city: [moscow, spb]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build social package
        run: |
          python scripts/events/build_social.py --city "${{ matrix.city }}"
      - name: Install renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render social files
        run: |
          # weekly.html is optional here. build_social.py writes the Instagram
          # and Telegram HTML; render_weekly.js must still produce those files
          # when the A4 digest was not built.
          node scripts/events/render_weekly.js
      - name: Send package to Materials channel
        env:
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ vars.SOCIAL_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${SOCIAL_TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${SOCIAL_TELEGRAM_CHAT_ID:-}" ]; then
            python scripts/events/send_social_telegram.py --city "${{ matrix.city }}"
          else
            echo "Telegram delivery is not configured; package will remain as an artifact."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: social-${{ matrix.city }}-next-week
          path: dist/events-weekly/social/
          retention-days: 30
