name: Events quality

on:
  pull_request:
    paths:
      - 'content/events.json'
      - 'content/events_curated.json'
      - 'events/sources.json'
      - 'scripts/events/**'
      - '.github/workflows/events-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile event scripts
        run: python -m py_compile scripts/events/*.py
      - name: Run event regression tests
        run: python -m unittest discover -s tests/events -p 'test_*.py'
      - name: Validate and normalize database
        run: python scripts/events/quality_gate.py content/events.json --fix --strict
      - name: Require normalized database in git
        run: git diff --exit-code -- content/events.json
