name: Events sheet sync

on:
  push:
    branches: [main]
    paths:
      - 'content/events.json'
      - 'content/events_time_verified.json'
      - '.github/workflows/events-sheet-sync.yml'
  workflow_dispatch:
    inputs:
      direction:
        description: "push = GitHub → Sheet, pull = Sheet → GitHub"
        required: true
        default: "pull"
        type: choice
        options: [pull, push]
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: events-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Pull editor changes
        if: github.event_name == 'schedule' || inputs.direction == 'pull'
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Queue time can leave this job on the triggering SHA. Refresh before
          # reading the database so Sheet edits land on the current events.
          bash scripts/events/git_sync_main.sh
          python scripts/events/pull_sheet.py
      - name: Commit editor changes
        if: github.event_name == 'schedule' || inputs.direction == 'pull'
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/events/persist_events_json.sh "Sync event moderation from Google Sheet"
      - name: Push database to Sheet
        if: github.event_name == 'push' || inputs.direction == 'push'
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Never publish the queued triggering commit. That snapshot is what
          # overwrote the Sheet and then failed with "fetch first".
          bash scripts/events/git_sync_main.sh
          python scripts/events/push_sheet.py
      - name: Persist editor changes captured during push
        if: github.event_name == 'push' || inputs.direction == 'push'
        env:
          EVENTS_SHEET_ID: ${{ vars.EVENTS_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/events/persist_events_json.sh "Preserve event moderation edits during Sheet push"
