<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-label="Иллюстрация для интерактивного квеста Chinese Lab">
<style>
  text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#121512}
  .headline{font-size:28px;font-weight:700;letter-spacing:2px}.caption{font-size:20px}.small{font-size:15px}
  .stroke{stroke:#151815;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#151815;stroke-width:2}.lime{fill:#d9f55e}.paper{fill:#fffdfa}
</style>
<rect width="1080" height="620" fill="#f8f9f5"/>
<rect x="0" y="0" width="1080" height="101" fill="#f0f1ed"/>
<text x="45" y="66" class="headline">幸福的家庭  /  家里</text>
<text x="841" y="62" class="caption">02 · 找线索</text>
<path d="M35 105H1040" class="stroke" fill="none"/>
<!-- desk and exam calendar at left -->
<rect x="116" y="177" width="275" height="220" rx="12" class="paper stroke"/>
<rect x="116" y="177" width="275" height="54" class="lime stroke"/>
<text x="162" y="212" class="caption">考试安排</text>
<text x="164" y="276" class="headline">下 星期</text>
<path d="M154 303H353M154 335H340M154 362H321" class="thin"/>
<rect x="66" y="414" width="340" height="24" fill="#d9dad4" class="stroke"/>
<path d="M86 438V565M386 438V565" class="stroke"/>
<!-- grandma's note -->
<rect x="484" y="174" width="280" height="239" rx="10" class="paper stroke" transform="rotate(3 624 294)"/>
<text x="533" y="219" class="caption">奶奶的纸条</text>
<path d="M515 252H727M515 286H711M515 321H720" class="thin"/>
<text x="523" y="367" class="headline">伤 心</text>
<!-- phone -->
<rect x="825" y="296" width="191" height="244" rx="24" fill="#20241f" class="stroke"/>
<rect x="839" y="316" width="162" height="205" rx="14" class="paper"/>
<text x="862" y="356" class="caption">发给奶奶</text>
<rect x="854" y="386" width="132" height="72" rx="10" class="lime"/>
<text x="871" y="426" class="caption">对不起！</text>
<text x="873" y="482" class="small">还没发出</text>
<!-- coat on left lower: hanger -->
<path d="M265 425V467M265 467L198 508H332L265 467" class="stroke" fill="none"/>
<path d="M218 515L186 534L180 592H353L348 534L318 515" fill="#e5e7e2" class="stroke"/>
<path d="M245 508Q265 531 286 508" class="thin" fill="none"/>
<rect x="488" y="493" width="260" height="83" rx="9" class="paper thin"/>
<text x="514" y="540" class="caption">先了解，再决定</text>
</svg>