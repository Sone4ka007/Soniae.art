<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-label="Иллюстрация для интерактивного квеста Chinese Lab">
<style>
  text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#121512}
  .headline{font-size:28px;font-weight:700;letter-spacing:2px}.caption{font-size:20px}.small{font-size:15px}
  .stroke{stroke:#151815;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#151815;stroke-width:2}.lime{fill:#d9f55e}.paper{fill:#fffdfa}
</style>
<rect width="1080" height="620" fill="#f8f9f5"/>
<rect width="1080" height="100" fill="#f0f1ed"/>
<text x="45" y="66" class="headline">幸福的家庭  /  商场</text>
<text x="845" y="62" class="caption">01 · 选礼物</text>
<path d="M30 103H1050" class="stroke" fill="none"/>
<!-- first hotspot: price poster at left -->
<rect x="113" y="170" width="290" height="205" rx="12" class="paper stroke"/>
<rect x="140" y="193" width="240" height="59" rx="6" class="lime thin"/>
<text x="191" y="232" class="headline">打 折</text>
<text x="154" y="302" class="caption">以前 400 元</text>
<text x="154" y="344" class="headline">现在 280 元</text>
<!-- quality tags at center -->
<path d="M455 153H710" class="stroke" fill="none"/>
<path d="M535 153V188" class="stroke" fill="none"/>
<rect x="468" y="188" width="195" height="165" rx="11" class="paper stroke"/>
<text x="498" y="238" class="headline">质量</text>
<path d="M492 266H635M492 293H626" class="thin" fill="none"/>
<text x="490" y="326" class="caption">这件毛衣质量好</text>
<!-- two sweaters, right -->
<path d="M742 144H1043M804 144V184M960 144V184" class="stroke" fill="none"/>
<path d="M783 183L730 218L690 295L751 312L779 265V441H917V265L944 312L1005 295L965 218L915 183L885 212H813Z" fill="#ebedef" class="stroke"/>
<path d="M802 183Q848 237 898 183" fill="none" class="stroke"/>
<path d="M798 266H902M798 292H902" class="thin" fill="none"/>
<rect x="795" y="354" width="109" height="38" rx="6" class="lime thin"/>
<text x="809" y="382" class="caption">毛衣 A</text>
<path d="M962 184L941 209L940 252L964 269L992 248L1000 218Z" fill="#e1e4dc" class="stroke"/>
<!-- note matching fourth hotspot -->
<rect x="321" y="430" width="259" height="120" rx="10" class="paper stroke" transform="rotate(-4 450 480)"/>
<text x="342" y="474" class="caption">给妈妈的礼物</text>
<text x="342" y="512" class="headline">样子 · 适合</text>
<path d="M63 564H1020" class="thin" fill="none"/>
<text x="54" y="596" class="small">找到价格、质量和衣服的颜色 · 点击图片上的提示</text>
</svg>