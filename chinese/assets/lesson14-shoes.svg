<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-label="商场 · 选鞋">
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#151a16}
.heading{font-size:29px;font-weight:700}.label{font-size:23px;font-weight:700}.sub{font-size:17px}
.outline{stroke:#172019;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.line{stroke:#172019;stroke-width:2;stroke-linejoin:round}
</style>
<rect width="1080" height="620" fill="#f7f8f2"/>
<rect width="1080" height="102" fill="#e9ede4"/>
