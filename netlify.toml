[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/1"
  to = "/wg/001/"
  status = 302

[[redirects]]
  from = "/wg/*"
  to = "/wg/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
