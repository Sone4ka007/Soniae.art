<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SWG Moderation</title>
  <link rel="stylesheet" href="/wg/admin/admin.css">
</head>
<body>
  <header class="top"><a href="/wg/">SONYAE_WG</a><span>MODERATION</span></header>
  <main class="shell">
    <section class="login" id="login">
      <p class="kicker">PRIVATE</p>
      <h1>МОДЕРАЦИЯ</h1>
      <p>Введите секрет администратора. Он хранится только в этой вкладке браузера.</p>
      <form id="login-form"><input id="secret" type="password" autocomplete="current-password" placeholder="WG_ADMIN_SECRET" required><button type="submit">ВОЙТИ</button></form>
      <p class="status" id="login-status"></p>
    </section>
    <section class="queue is-hidden" id="queue">
      <div class="queue-head"><div><p class="kicker">PENDING</p><h1>НОВЫЕ ОСТАНОВКИ</h1></div><div class="queue-actions"><strong id="count">0</strong><button id="refresh" type="button">ОБНОВИТЬ</button><button id="logout" type="button">ВЫЙТИ</button></div></div>
      <div id="items" class="items"></div><p class="status" id="queue-status"></p>
    </section>
  </main>
  <script src="/wg/admin/admin.js"></script>
</body>
</html>
